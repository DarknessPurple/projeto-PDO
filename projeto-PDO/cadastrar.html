<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="css/estilos.css">
    <meta charset="UTF-8">
    <title>Cadastrar Aluno</title>
</head>
<body>
    <header class="container">
        <a class="botao-header" href="index.html">Início</a>
        <div class="container-titulo">
            <img src="img/logo.jpeg" alt="Logo do Sistema Escola">
            <div>
                <h1>Sistema Escolar</h1>
                <h2>Gerenciamento de Alunos</h2>
            </div>
        </div>
        <a class="botao-header" href="listar.html">Mostrar lista</a>
    </header>

    <main class="conteudo">
        <section class="painel">
            <h1>Cadastrar Aluno</h1>
            <form class="formulario" action="php/cadastrar.php" method="POST">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="1" required>

                <div class="acoes">
                    <button class="botao" type="submit">Cadastrar</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="rodape">Sistema Escola · PHP + MySQL &copy; 2026</footer>

</body>
</html>
