
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="css/estilos.css">
    <meta charset="UTF-8">
    <title>Atualizar Aluno</title>
</head>
<body>
    <header class="container">
        <a class="botao-header" href="index.html">Início</a>
        <div class="container-titulo">
            <img src="img/logo.jpeg" alt="Logo do Sistema Escola">
            <div>
                <h1>Sistema Escolar</h1>
                <h2>Gerenciamento de Alunos</h2>
            </div>
        </div>
        <a class="botao-header" href="listar.html">Mostrar lista</a>
    </header>

    <main class="conteudo">
        <section class="painel">
            <h1>Atualizar E-mail de Aluno</h1>
            <form class="formulario" action="php/atualizar.php" method="POST">
                <label for="id">ID do aluno:</label>
                <input type="number" id="id" name="id" min="1" required>

                <label for="email">Novo e-mail:</label>
                <input type="email" id="email" name="email" required>

                <div class="acoes">
                    <button class="botao" type="submit">Atualizar</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="rodape">Sistema Escola · PHP + MySQL &copy; 2026</footer>

<script>
    const parametros = new URLSearchParams(window.location.search);
    const id = parametros.get("id");
    const email = parametros.get("email");

    if (id) {
        document.getElementById("id").value = id;
    }
    if (email) {
        document.getElementById("email").value = email;
    }
</script>

</body>
</html>
